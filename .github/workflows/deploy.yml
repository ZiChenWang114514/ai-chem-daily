name: Deploy reviewed site

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: ai-chem-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    needs: deploy
    if: "${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'data: aix daily') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published digest
        uses: actions/checkout@v6

      - name: Send the digest through GitHub notifications
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          digest_date="$(python -c 'import json; print(json.load(open("public/data/daily/latest.json", encoding="utf-8"))["date"])')"
          title="AIX Daily 五频道日报 · ${digest_date}"
          if gh issue list --state all --search "${title} in:title" --json title --jq '.[].title' | grep -Fxq "$title"; then
            echo "Notification issue already exists."
          else
            gh issue create \
              --title "$title" \
              --body-file public/email/latest.md \
              --assignee ZiChenWang114514 \
              --label daily-digest
          fi
