name: Import scheduled task materials

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Existing intake issue number"
        required: true

permissions:
  contents: write
  issues: write

concurrency:
  group: aix-daily-content
  cancel-in-progress: false

jobs:
  import:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (startsWith(github.event.issue.title, 'AIX Intake') && contains(github.event.issue.labels.*.name, 'scheduled-intake'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Read intake issue
        id: issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          MANUAL_ISSUE: ${{ inputs.issue_number }}
        shell: bash
        run: |
          issue_number="${EVENT_ISSUE:-$MANUAL_ISSUE}"
          gh issue view "$issue_number" --repo "$GITHUB_REPOSITORY" --json body --jq .body > work-intake.md
          echo "number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/${issue_number}" >> "$GITHUB_OUTPUT"

      - name: Import submitted materials
        id: import
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_URL: ${{ steps.issue.outputs.url }}
        run: python backend/import_intake.py work-intake.md --site-root public

      - name: Rebuild public interfaces
        run: python backend/hub_publish.py --site-root public

      - name: Verify generated site
        run: python -m unittest discover -s tests -v

      - name: Publish imported materials
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/email public/api
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "data: import ${{ steps.import.outputs.channel }} ${{ steps.import.outputs.date }}"
            git pull --rebase origin main
            git push origin main
          fi

      - name: Confirm import on the issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >-
          gh issue comment "${{ steps.issue.outputs.number }}"
          --repo "$GITHUB_REPOSITORY"
          --body "资料已导入：${{ steps.import.outputs.result }}。网站部署将由 Pages 工作流继续完成。"
