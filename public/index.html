<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AIX每日精读：化学、生物、数学、公开观点与工程更新的每日精选。">
  <meta name="theme-color" content="#122033">
  <meta property="og:title" content="AIX每日精读">
  <meta property="og:description" content="化学、生物、数学、公开观点与工程更新的每日精选。">
  <meta property="og:image" content="https://zichenwang114514.github.io/ai-x-daily/assets/art/hero.jpg">
  <title>AIX每日精读</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="preload" as="image" href="assets/art/hero.webp" type="image/webp" fetchpriority="high">
  <link rel="preload" as="fetch" href="data/daily/latest.json" crossorigin>
  <link rel="preload" as="fetch" href="api/v1/manifest.json" crossorigin>
</head>
<body data-page="home" data-root="">
  <a class="skip-link" href="#papers">跳到日报内容</a>

  <header class="site-header">
    <div class="shell site-header__inner">
      <nav class="topbar" aria-label="主要导航">
        <a class="brand" href="./" aria-label="AIX每日精读首页">
          <img class="brand__mark" src="assets/logo.svg" width="36" height="36" alt="">
          <span class="brand__name">AIX每日精读</span>
        </a>
        <div class="topbar__actions">
          <a class="library-link" href="library/">收藏<span class="library-count" data-library-count hidden></span></a>
          <div class="history-anchor">
            <button class="history-button" id="history-button" type="button" aria-expanded="false" aria-controls="history-panel">
              历史日报
              <span aria-hidden="true">⌄</span>
            </button>
            <div class="history-panel" id="history-panel" hidden>
              <div class="history-panel__head">
                <strong>历史日报</strong>
                <span>按日期查阅已发布内容</span>
              </div>
              <div id="history-list" class="history-list" aria-live="polite"></div>
            </div>
          </div>
        </div>
      </nav>

      <nav class="channel-nav" id="channel-nav" aria-label="信息频道">
        <a class="channel-nav__item is-active" href="./" aria-current="page">总览</a>
        <a class="channel-nav__item" href="channels/aixchem/">AI × Chem</a>
        <a class="channel-nav__item" href="channels/aixbio/">AI × Bio</a>
        <a class="channel-nav__item" href="channels/aixmath/">AI × Math</a>
        <a class="channel-nav__item" href="channels/aivoices/">AI Voices</a>
        <a class="channel-nav__item" href="channels/engineering/">Engineering</a>
      </nav>
    </div>
  </header>

  <section class="hero" aria-labelledby="hero-title">
    <div class="shell hero__inner">
      <div class="hero__copy">
        <p class="hero__date">
          <time id="digest-date" datetime="">载入中</time>
          <span id="hero-weekday"></span>
        </p>
        <p class="hero__kicker" id="eyebrow">今日精选</p>
        <h1 id="hero-title">五个频道的研究更新</h1>
        <p id="subtitle" class="hero__lead">正在读取今日内容…</p>
        <p class="hero__meta">
          <span id="stat-selected">—</span> 项精选
          <span class="hero__dot" aria-hidden="true">·</span>
          <span id="generated-time">—</span>
          <a class="hero__today" id="back-to-today" href="./" hidden>返回今日</a>
        </p>
      </div>
      <figure class="hero__art">
        <picture>
          <source id="hero-art-webp" srcset="assets/art/hero.webp" type="image/webp">
          <img id="hero-art" src="assets/art/hero.jpg" width="960" height="540" alt="" fetchpriority="high" decoding="async">
        </picture>
      </figure>
    </div>
  </section>

  <main class="shell main-content">
    <section class="channel-overview" data-home-only aria-labelledby="channel-title">
      <div class="section-heading">
        <h2 id="channel-title">五个频道</h2>
      </div>
      <div class="channel-cards" id="channel-cards" aria-live="polite"></div>
    </section>

    <section id="papers" class="digest" aria-labelledby="papers-title">
      <div class="section-heading">
        <div>
          <h2 id="papers-title">今日内容</h2>
          <p id="result-count" aria-live="polite"></p>
        </div>
      </div>

      <section class="toolbar" aria-label="搜索与来源">
        <div class="search-box">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.3-4.3m2.3-5.2a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
          <label class="sr-only" for="search-input">搜索题名、作者与摘要</label>
          <input id="search-input" type="search" placeholder="搜索题名、作者、摘要或标签">
        </div>
        <div class="filter-group" id="source-filters" aria-label="按来源筛选">
          <button class="filter-chip is-active" type="button" data-source="all">全部来源</button>
        </div>
      </section>

      <p class="source-note" id="source-note" hidden></p>
      <div id="paper-groups" class="paper-groups" aria-live="polite"></div>
      <div id="empty-state" class="empty-state" hidden>
        <picture>
          <source id="empty-art-webp" type="image/webp">
          <img id="empty-art" width="320" height="320" alt="" loading="lazy" decoding="async">
        </picture>
        <div>
          <strong id="empty-title">今日暂无精选</strong>
          <p id="empty-text">这一天没有达到收录标准的更新。可在上方打开历史日报。</p>
        </div>
      </div>
    </section>

    <section class="activity-panel" aria-labelledby="activity-title">
      <div class="activity-panel__head">
        <div>
          <h2 id="activity-title">近期更新</h2>
          <p id="activity-summary">正在读取历史记录…</p>
        </div>
        <p class="activity-hint">点击色块可打开对应日期</p>
      </div>
      <div class="heatmap-scroll" tabindex="0" aria-label="可横向滚动的年度活动日历">
        <div class="heatmap" id="activity-heatmap" role="grid" aria-label="过去一年每日研究活动"></div>
      </div>
      <div class="activity-legend" aria-hidden="true">
        <span>少</span><i data-level="0"></i><i data-level="1"></i><i data-level="2"></i><i data-level="3"></i><i data-level="4"></i><span>多</span>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="shell footer-grid">
      <div>
        <strong>AIX每日精读</strong>
        <p>化学、生物、数学、公开观点与工程更新的每日精选。</p>
      </div>
      <div class="footer-note">
        <p>预印本、公开观点与软件发布均请结合原始来源判断。</p>
        <p id="footer-date">—</p>
        <p class="footer-links">
          <a href="library/">收藏</a>
          <a href="task/">运行说明</a>
          <a href="api/v1/manifest.json">接口清单</a>
        </p>
      </div>
    </div>
  </footer>

  <template id="paper-template">
    <article class="paper-card">
      <span class="rank"></span>
      <div class="paper-card__body">
        <div class="paper-card__topline">
          <span class="source-badge"></span>
          <span class="topic-label"></span>
          <button class="save-button" type="button" aria-pressed="false">收藏</button>
        </div>
        <h3><a class="paper-title" target="_blank" rel="noopener noreferrer"></a></h3>
        <p class="paper-meta"></p>
        <div class="tag-list"></div>
        <p class="summary-zh"></p>
        <p class="why-it-matters"></p>
        <details class="abstract-details">
          <summary>查看原文摘要</summary>
          <p class="abstract-text"></p>
        </details>
        <div class="note-block" hidden>
          <label class="note-label">笔记</label>
          <textarea class="note-field" rows="3" placeholder="记下要核对的实验、可复用的方法，或下次精读时要看的部分。"></textarea>
          <p class="note-status" aria-live="polite"></p>
        </div>
      </div>
    </article>
  </template>

  <script src="assets/app.js" defer></script>
</body>
</html>
